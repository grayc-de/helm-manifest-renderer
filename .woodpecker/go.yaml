when:
  - branch: main
    event:
      - pull_request
      - push
      - manual

steps:
  # `fmt` (make fmt-check) used to run here. woodpecker-lint v0.4.0 bundles a
  # gofmt detector with identical semantics — `test -z "$(gofmt -l .)"` — so it
  # moved to .woodpecker/lint.yaml. The Makefile target stays for local use;
  # vet/test/build still need the Go toolchain, so this pipeline remains.
  vet:
    image: golang:1.26
    commands:
      - make vet

  test:
    image: golang:1.26
    commands:
      - make test

  build:
    image: golang:1.26
    commands:
      - pwd
      - ls -la
      - find . -maxdepth 2 -type d | sort
      - git rev-parse HEAD
      - make build
