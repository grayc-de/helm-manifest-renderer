when:
  event:
    - manual
    - pull_request
    # `push` matters now that gofmt runs here rather than in go.yaml, which
    # does run on push: without it a merge to main would land unchecked.
    - push
  branch: main
  path:
    - .woodpecker/lint.yaml
    - .markdownlintignore
    - .markdownlint.yaml
    - .yamllint.yaml
    - .justfile
    - "**/Dockerfile"
    - "**/*.md"
    - "**/*.y*ml"
    - "**/*.sh"
    - "**/*.go"

steps:

  # Single auto-detecting lint step: runs yamllint, markdownlint, hadolint,
  # shellcheck, just, gofmt, tofu, renovate-config-validator,
  # backstage-entity-validator and woodpecker-cli over the workspace,
  # whichever file types are present. Check-only on purpose — fixing is a
  # local `just lint-fix` affair; CI must report, not rewrite a branch it is
  # not pushing.
  lint:
    image: git.grayc.dev/grayc-devops/woodpecker-lint:v0.4.0
